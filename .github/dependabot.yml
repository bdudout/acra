# Mises à jour de sécurité et de version des dépendances (OWASP A06/A08).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # ESLint 10 déclenche une erreur d'API dans eslint-plugin-react utilisé
    # par eslint-config-next. Garder les correctifs 9.x, réévaluer avec le plugin.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
