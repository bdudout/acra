name: Prepare versioned release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (v1.0.0-rc.1 ou v1.0.0). Une stable reste brouillon avant recette.'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      # Clé privée cosign (souveraine : signature SANS journal de transparence public).
      # Absente ⇒ la signature du SBOM est simplement sautée (l'archivage + le SHA256 restent).
      COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Vérifier version et CI du commit exact
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
          # #185 : la version affichée par l'application vient de package.json. Un tag
          # qui ne lui correspond pas ferait annoncer une fausse mise à jour.
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${VERSION#v}" ]; then echo "package.json ($PKG) ≠ $VERSION : aligner package.json avant la release." >&2; exit 1; fi
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then exit 1; fi
          # Notes de version rédigées (docs/releases/<version>.md) : obligatoires pour
          # une stable — le corps d'une release n'est jamais la fiche de recette vierge.
          if [[ "$VERSION" != *-rc.* ]] && [ ! -s "docs/releases/$VERSION.md" ]; then
            echo "Notes de version manquantes : docs/releases/$VERSION.md (cf. docs/releases/README.md)." >&2; exit 1
          fi
          gh run list --workflow security.yml --commit "$GITHUB_SHA" --branch main --event push --json conclusion --jq '.[0].conclusion' | grep -qx success
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          push: true
          # Attestations OCI attachées à l'image dans le registre :
          #  - sbom : SBOM SPDX de l'image (généré par buildkit) ;
          #  - provenance mode=max : provenance SLSA complète de la construction.
          sbom: true
          provenance: mode=max
          tags: ghcr.io/bdudout/acra:${{ inputs.version }}
          build-args: |
            ACRA_VERSION=${{ inputs.version }}
            ACRA_REVISION=${{ github.sha }}
      # ── SBOM CycloneDX (dépendances applicatives + couches image) ──────────────
      # Syft scanne l'image POUSSÉE (via son digest exact) → un SBOM CycloneDX JSON
      # complet (npm + OS Alpine). Archivé comme asset de release + hashé (intégrité).
      - name: Générer le SBOM CycloneDX de l'image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/bdudout/acra@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: Signer le SBOM (cosign, clé souveraine — si configurée)
        id: sign
        if: env.COSIGN_KEY != ''
        run: |
          curl -sSfL "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64" -o /usr/local/bin/cosign
          chmod +x /usr/local/bin/cosign
          # --tlog-upload=false : aucune écriture dans un journal de transparence public (souveraineté).
          cosign sign-blob --yes --tlog-upload=false --key env://COSIGN_KEY \
            --output-signature sbom.cdx.json.sig sbom.cdx.json
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Manifeste et fiche de livraison
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SBOM_SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          MIGRATIONS_HASH="$(find prisma/migrations -name migration.sql -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          export MIGRATIONS_HASH
          SBOM_SHA256="$(sha256sum sbom.cdx.json | cut -d' ' -f1)"
          export SBOM_SHA256
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("release.json", JSON.stringify({version:process.env.VERSION, revision:process.env.GITHUB_SHA, image:"ghcr.io/bdudout/acra@"+process.env.DIGEST, migrationsHash:process.env.MIGRATIONS_HASH, sbom:{file:"sbom.cdx.json", format:"CycloneDX", sha256:process.env.SBOM_SHA256, signed:process.env.SBOM_SIGNED==="true"}}, null, 2))'
          # Corps de la release = notes rédigées + changements depuis la version
          # précédente + artefacts. La fiche de recette est jointe en fichier.
          NOTES="docs/releases/$VERSION.md"
          if [ -s "$NOTES" ]; then cp "$NOTES" release-notes.md; else printf '## ACRA %s (préversion)\n' "$VERSION" > release-notes.md; fi
          PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA^" 2>/dev/null || true)"
          {
            echo; echo "### Changements depuis ${PREV:-l’origine}"
            git log --no-merges --format='- %s (%h)' ${PREV:+$PREV..}"$GITHUB_SHA" | head -100
            echo; echo "### Artefacts"
            echo "- Image : \`ghcr.io/bdudout/acra@$DIGEST\` (tag \`$VERSION\`)"
            echo "- Manifeste \`release.json\`, SBOM CycloneDX \`sbom.cdx.json\`, fiche de recette \`fiche-recette.md\`"
          } >> release-notes.md
          cp docs/RELEASE-CHECKLIST.md fiche-recette.md
          # Assets : manifeste + SBOM (+ signature si produite) + fiche de recette.
          ASSETS=(release.json sbom.cdx.json fiche-recette.md)
          [ -f sbom.cdx.json.sig ] && ASSETS+=(sbom.cdx.json.sig)
          if [[ "$VERSION" == *-rc.* ]]; then
            gh release create "$VERSION" "${ASSETS[@]}" --target "$GITHUB_SHA" --prerelease --title "$VERSION" --notes-file release-notes.md
          else
            gh release create "$VERSION" "${ASSETS[@]}" --target "$GITHUB_SHA" --draft --title "$VERSION — recette requise" --notes-file release-notes.md
          fi
