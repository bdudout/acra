name: Migrations Prisma

# Lot 5 de docs/specs/sauvegarde-rollback-spec.md : une migration nouvelle destructive exige l'en-tête
# `-- acra:destructive <raison>` (et, à partir du 16/10/2026, `-- contract: <justification>` : règle expand/contract du
# déploiement progressif, lot H1.4) ; une migration déjà publiée ne se modifie ni ne se supprime jamais.
on:
  pull_request:
    paths: ['prisma/migrations/**', 'src/lib/migration-policy.ts', 'src/lib/migration-check.ts', 'scripts/check-migrations.ts']

permissions:
  contents: read

jobs:
  policy:
    name: Politique de migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0 (runtime Node 24)
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Vérifier les migrations contre la branche de base
        run: npx tsx scripts/check-migrations.ts --ci --base "origin/${{ github.base_ref }}"
