# =============================================================================
# ACRA — Docker Compose
# =============================================================================
#
# Pré-requis : un fichier .env doit exister avec les secrets configurés.
# Créez-le en exécutant : ./scripts/setup.sh  (ou : make setup)
#
# Démarrage :  docker compose up -d
# Logs :       docker compose logs -f app
# Arrêt :      docker compose down
# =============================================================================

x-buildkit: &buildkit
  DOCKER_BUILDKIT: "1"

# Journaux plafonnés à 30 Mo par service (sans cela, json-file grossit sans limite).
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Construction déclarée UNE fois : app et migrator partagent la même image (même tag, mêmes arguments).
x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  # Identité servie par /api/health (la mise à jour vérifie la révision cible).
  args:
    ACRA_VERSION: ${ACRA_VERSION:-development}
    ACRA_REVISION: ${ACRA_REVISION:-unknown}

services:
  db:
    image: postgres:16-alpine
    container_name: ebios_db
    restart: unless-stopped
    logging: *logging
    environment:
      # Ces variables sont lues depuis le fichier .env
      # Générez .env avec : ./scripts/setup.sh
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Service de migration Prisma — s'exécute une fois puis se termine (exit 0)
  # L'app attend que ce service soit "service_completed_successfully"
  # Cela élimine la race condition migrate/startup du service app.
  # ---------------------------------------------------------------------------
  migrator:
    image: acra-app:${ACRA_VERSION:-dev}
    build: *app-build
    container_name: ebios_migrator
    restart: "no"
    logging: *logging
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # 0 pendant une mise à jour (scripts/update.sh) : jamais de « migrate resolve » automatique.
      ACRA_MIGRATE_AUTO_RESOLVE: ${ACRA_MIGRATE_AUTO_RESOLVE:-1}
    depends_on:
      db:
        condition: service_healthy
    # Réconciliation P3009 sûre (voir scripts/migrate-recover.sh) PUIS migrate deploy.
    # Le script est monté en volume (comme backup.sh) pour rester modifiable sans rebuild.
    volumes:
      - ./scripts/migrate-recover.sh:/app/scripts/migrate-recover.sh:ro
    command: >
      sh -c "sh scripts/migrate-recover.sh"

  app:
    image: acra-app:${ACRA_VERSION:-dev}
    build: *app-build
    container_name: ebios_app
    restart: unless-stopped
    logging: *logging
    environment:
      # Connexion à la base — doit correspondre aux variables du service "db" ci-dessus
      DATABASE_URL: ${DATABASE_URL}
      # Secret JWT pour NextAuth — générez avec : openssl rand -base64 48
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # URL publique de l'application (ex: https://votre-domaine.com en prod)
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Jeton protégeant les endpoints planifiés /api/cron/* (voir service "scheduler").
      # Absent ⇒ ces endpoints répondent 503 (planification désactivée).
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      # 127.0.0.1 (et non localhost) : dans le conteneur, localhost résout en IPv6
      # ::1, sur lequel le serveur Next standalone n'écoute pas → connection refused.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Dossier d'échange avec l'agent de mise à jour hôte (bouton « Mettre à jour »,
    # issue #185) : l'app y lit la pulsation/le statut et dépose une demande dans
    # inbox/. Sans agent installé (scripts/update-agent.sh --install), le bouton
    # affiche simplement les commandes de mise à jour.
    volumes:
      - ./.acra-update:/app/.acra-update
      # Documents téléversés : volume nommé (sans lui ils vivent dans la couche du conteneur
      # et sont perdus à chaque recréation, donc à chaque mise à jour).
      - documents_data:/app/.data/documents
    command: ["node", "server.js"]

  # ---------------------------------------------------------------------------
  # Planificateur des tâches périodiques (/api/cron/*) — snapshots de conformité
  # et alertes/synthèses de dérogations. Appelle l'app EN INTERNE (http://app:3000)
  # avec le CRON_SECRET ; aucune exposition réseau. Inactif si CRON_SECRET absent.
  # Cadence (cf. scripts/scheduler.sh) : snapshots 02:00 · relances (un e-mail
  # de synthèse par personne) 06:00 · tableau-bord-mensuel le 1er à 08:00. Le fuseau suit TZ (défaut UTC).
  #
  # ⚠️ Variante CLOUD alternative : .github/workflows/scheduled-tasks.yml (appelle
  # l'instance déployée depuis GitHub Actions). N'activer QUE l'UNE des deux, sinon
  # les deux planificateurs appelleraient les mêmes tâches (sans double envoi, mais inutilement).
  # ---------------------------------------------------------------------------
  scheduler:
    image: curlimages/curl:8.11.1
    container_name: ebios_scheduler
    restart: unless-stopped
    logging: *logging
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      SCHEDULER_TICK: ${SCHEDULER_TICK:-900}
      TZ: ${TZ:-UTC}
    volumes:
      - ./scripts/scheduler.sh:/scheduler.sh:ro
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scheduler.sh"]

  # ---------------------------------------------------------------------------
  # Service de backup — pg_dump quotidien avec rotation 7 jours
  # Lancer manuellement : docker compose run --rm backup
  # En prod, déclencher via cron host ou un scheduler (ex: ofelia, supercronic)
  # ---------------------------------------------------------------------------
  # Sauvegarde AUTOMATIQUE : le planificateur exécute backup.sh au démarrage puis
  # chaque jour à BACKUP_HOUR (dump compressé + rotation + copie hors-site optionnelle).
  # Sauvegarde ponctuelle à la demande : docker compose run --rm backup /backup.sh
  backup:
    image: postgres:16-alpine
    container_name: ebios_backup
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      # Rétention par nombre de dumps (défaut 7). BACKUP_RETENTION (jours) : ancienne règle, seulement si BACKUP_KEEP est absent.
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      # Copie hors-site (optionnelle) : commande recevant le chemin du dump en argument.
      BACKUP_OFFSITE_CMD: ${BACKUP_OFFSITE_CMD:-}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/backup-scheduler.sh:/backup-scheduler.sh:ro
      - backup_data:/backups
    depends_on:
      db:
        condition: service_healthy
    command: ["/bin/sh", "/backup-scheduler.sh"]

volumes:
  postgres_data:
    driver: local
  documents_data:
    driver: local
  backup_data:
    driver: local
